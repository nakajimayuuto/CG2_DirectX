name: DebugBuild
on:
  push:
    branches:
      - master
      
env:
  SOLUTION_FIRE_PATH: Project/CG2_DirectX.sln
  CONFIGURATION: Debug
jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkount
        uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      
      - name: Build
        run:
          msbuild ${{env.SOLUTION_FIRE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
          
